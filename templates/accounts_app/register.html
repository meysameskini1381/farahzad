<!DOCTYPE html>
{% load static %}
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود / ثبت نام</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
    {% csrf_token %}

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full mx-auto mb-4 flex items-center justify-center">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">ورود / ثبت نام</h1>
            <p class="text-gray-500 mt-2">برای ادامه شماره تلفن خود را وارد کنید</p>
        </div>

        <div id="alert" class="hidden mb-6 p-4 rounded-lg"></div>

        <form id="authForm">
            <div id="phoneSection">
                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-2">شماره تلفن</label>
                    <input
                        type="text"
                        id="phoneNumber"
                        placeholder="09123456789"
                        maxlength="11"
                        class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none transition-colors text-lg"
                        autocomplete="tel"
                    >
                </div>
                <button
                    type="button"
                    id="sendOtpBtn"
                    class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold py-3 rounded-lg hover:from-blue-600 hover:to-indigo-700 transition-all transform hover:scale-105 shadow-lg"
                >
                    ارسال کد تایید
                </button>
            </div>

            <div id="otpSection" class="hidden">
                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-2">کد تایید</label>
                    <input
                        type="text"
                        id="otpCode"
                        placeholder="123456"
                        maxlength="6"
                        class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none transition-colors text-lg text-center tracking-widest"
                        autocomplete="one-time-code"
                    >
                </div>

                <div class="mb-6 text-center">
                    <div id="timerDisplay" class="text-lg font-semibold text-gray-700 mb-2"></div>
                    <button
                        type="button"
                        id="resendBtn"
                        class="text-blue-600 hover:text-blue-700 font-semibold disabled:text-gray-400 disabled:cursor-not-allowed"
                        disabled
                    >
                        ارسال مجدد کد
                    </button>
                </div>

                <button
                    type="button"
                    id="verifyOtpBtn"
                    class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold py-3 rounded-lg hover:from-green-600 hover:to-emerald-700 transition-all transform hover:scale-105 shadow-lg"
                >
                    تایید کد
                </button>

                <button
                    type="button"
                    id="changeNumberBtn"
                    class="w-full mt-3 bg-gray-200 text-gray-700 font-semibold py-2 rounded-lg hover:bg-gray-300 transition-colors"
                >
                    تغییر شماره
                </button>
            </div>
        </form>
    </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function getCSRFToken() {
    let token = getCookie('csrftoken');
    if (!token) {
        const inputToken = document.querySelector('input[name="csrfmiddlewaretoken"]');
        token = inputToken ? inputToken.value : null;
    }
    return token;
}

function showAlert(message, type) {
    const alertDiv = $('#alert');
    alertDiv.removeClass('hidden bg-green-100 text-green-700 bg-blue-100 text-blue-700 bg-red-100 text-red-700');

    if (type === 'success' || type === 'login') {
        alertDiv.addClass('bg-green-100 text-green-700');
    } else if (type === 'info' || type === 'register') {
        alertDiv.addClass('bg-blue-100 text-blue-700');
    } else {
        alertDiv.addClass('bg-red-100 text-red-700');
    }

    alertDiv.text(message).removeClass('hidden');
    setTimeout(() => alertDiv.addClass('hidden'), 5000);
}

let timerInterval = null;

function startTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    let timeLeft = 120;
    const timerDisplay = $('#timerDisplay');
    const resendBtn = $('#resendBtn');

    timerDisplay.text('زمان باقی‌مانده: 2:00').removeClass('text-red-600');
    resendBtn.prop('disabled', true).addClass('opacity-50 cursor-not-allowed');

    timerInterval = setInterval(() => {
        timeLeft--;
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerDisplay.text(`زمان باقی‌مانده: ${minutes}:${seconds.toString().padStart(2, '0')}`);

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            timerDisplay.text('زمان تمام شد!').addClass('text-red-600');
            resendBtn.prop('disabled', false).removeClass('opacity-50 cursor-not-allowed');
        }
    }, 1000);
}

function stopTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
    $('#timerDisplay').text('').removeClass('text-red-600');
    $('#resendBtn').prop('disabled', false).removeClass('opacity-50 cursor-not-allowed');
}

$(document).ready(function() {
    $('#sendOtpBtn, #resendBtn').click(function() {
        const phoneNumber = $('#phoneNumber').val().trim();
        const btnElement = $(this);

        if (phoneNumber.length !== 11 || !phoneNumber.startsWith('0') || !/^\d+$/.test(phoneNumber)) {
            showAlert('شماره تلفن نامعتبر است', 'error');
            return;
        }

        const csrfToken = getCSRFToken();
        if (!csrfToken) {
            showAlert('خطا در دریافت توکن امنیتی', 'error');
            return;
        }

        btnElement.prop('disabled', true).text('در حال ارسال...');

        $.ajax({
            url: '/api/account/auth/send-otp/',
            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken,
                'Content-Type': 'application/json'
            },
            data: JSON.stringify({phone: phoneNumber}),
            success: function(response) {
                showAlert(response.detail, 'success');
                $('#phoneSection').addClass('hidden');
                $('#otpSection').removeClass('hidden');
                $('#otpCode').val('').focus();
                startTimer();
                btnElement.prop('disabled', false).text(btnElement.attr('id') === 'sendOtpBtn' ? 'ارسال کد تایید' : 'ارسال مجدد');
            },
            error: function(xhr) {
                let errorMsg = 'خطا در ارسال کد تایید';
                if (xhr.responseJSON && xhr.responseJSON.detail) {
                    errorMsg = xhr.responseJSON.detail;
                } else if (xhr.responseJSON && xhr.responseJSON.phone) {
                    errorMsg = xhr.responseJSON.phone[0];
                }
                showAlert(errorMsg, 'error');
                btnElement.prop('disabled', false).text(btnElement.attr('id') === 'sendOtpBtn' ? 'ارسال کد تایید' : 'ارسال مجدد');
            }
        });
    });

    $('#verifyOtpBtn').click(function() {
        const phoneNumber = $('#phoneNumber').val().trim();
        const code = $('#otpCode').val().trim();
        const btnElement = $(this);

        if (code.length !== 6 || !/^\d+$/.test(code)) {
            showAlert('کد تایید نامعتبر است', 'error');
            return;
        }

        const csrfToken = getCSRFToken();
        if (!csrfToken) {
            showAlert('خطا در دریافت توکن امنیتی', 'error');
            return;
        }

        btnElement.prop('disabled', true).text('در حال تایید...');

        $.ajax({
            url: '/api/account/auth/verify-otp/',
            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken,
                'Content-Type': 'application/json'
            },
            data: JSON.stringify({phone: phoneNumber, code: code}),
            success: function(response) {
                stopTimer();
                showAlert(response.detail, response.type);
                setTimeout(() => window.location.href = '/', 2000);
            },
            error: function(xhr) {
                let errorMsg = 'کد تایید نامعتبر است';
                if (xhr.responseJSON && xhr.responseJSON.detail) {
                    errorMsg = xhr.responseJSON.detail;
                }
                showAlert(errorMsg, 'error');
                btnElement.prop('disabled', false).text('تایید کد');
            }
        });
    });

    $('#changeNumberBtn').click(function() {
        stopTimer();
        $('#otpSection').addClass('hidden');
        $('#phoneSection').removeClass('hidden');
        $('#otpCode').val('');
        $('#phoneNumber').focus();
    });

    $('#phoneNumber').focus().keypress(function(e) {
        if (e.which === 13) {
            e.preventDefault();
            $('#sendOtpBtn').click();
        }
    });

    $('#otpCode').keypress(function(e) {
        if (e.which === 13) {
            e.preventDefault();
            $('#verifyOtpBtn').click();
        }
    });
});
</script>

</body>
</html>
